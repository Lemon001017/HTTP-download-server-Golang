version: '3'

services:
  http-download-server:
    build: .
    container_name: http-download-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # 数据库持久化
      - ./downloads:/app/downloads  # 下载文件持久化
    restart: always

  nginx:
    image: nginx:alpine
    container_name: http-download-server-nginx
    ports:
      - "80:80"
    volumes:
      - ./ui:/usr/share/nginx/html  # 挂载前端文件
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # 挂载Nginx配置
    depends_on:
      - http-download-server
    restart: always