<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File</title>
    <script src="./assets/tailwind-3.3.2.js"></script>
    <script type="module" src="./assets/alpine.min.js"></script>
    <script nomodule src="./assets/alpine-ie11.min.js" defer></script>
    <script src="./api.js"></script>
    <script>
        function initFile() {
            var originPath = '/'
            return {
                files: [],
                optionValue: '',
                filePath: [''],
                sort: '',
                order: 'up',
                currentPageColor: '',
                showImagePreview: false,
                previewImageSrc: '',
                previewImageName: '',
                showVideoPlayer: false,
                videoSrc: '',
                videoName: '',
                showRenameModal: false,
                newFileName: '',
                showDeleteConfirm: false,
                selectedFile: null,
                showCreateDirModal: false,
                newDirName: '',
                searchQuery: '',
                isSearching: false,
                showAdvancedSearch: false,
                exactMatch: false,
                recursiveSearch: true,
                searchResults: [],
                async initData() {
                    this.currentPageColor = document.body.getAttribute('data-page-type')
                    this.fetchList()
                },
                async fetchList(paths, type, sort) {
                    if (sort) {
                        if (sort === this.sort) {
                            this.order = (this.order === 'up' ? 'down' : 'up')
                        } else {
                            this.sort = sort
                            this.order = 'up'
                        }
                    }
                    
                    console.log('Current sort:', 'Field=', this.sort, 'Direction=', this.order)
                    let path = '';
                    if (paths) {
                        for (let i = 0; i < paths.length; i++) {
                            path = paths.join('/')
                        }
                    }
                    if (type) {
                        this.optionValue = type
                    }
                    
                    let data = {
                        path: path || '/',
                        type: this.optionValue,
                        sort: this.sort,
                        order: this.order
                    }
                    this.files = await fetchFileList(data, path)
                },
                async goFile(file) {
                    if (file && file.directory) {
                        let path = file.filePath
                        let data = {
                            path: path,
                            type: this.optionValue,
                            sort: this.sort,
                            order: this.order
                        }
                        this.filePath.push(file.fileName)
                        this.files = await fetchFileList(data)
                        console.log('Navigate to directory:', path, 'File list:', this.files)
                    } else if (file && this.isImageFile(file.fileType)) {
                        // 预览图片
                        this.previewImage(file)
                    } else if (file && this.isVideoFile(file.fileType)) {
                        // 播放视频
                        this.playVideo(file)
                    }
                },
                async goBack(path) {
                    const index = this.filePath.indexOf(path)
                    this.filePath.splice(index + 1)
                    if (this.filePath) {
                        for (let i = 0; i < this.filePath.length; i++) {
                            path = this.filePath.join('/')
                        }
                    }
                    let data = {
                        path: path,
                        type: this.optionValue,
                        sort: this.sort,
                        order: this.order
                    }
                    this.files = await fetchFileList(data)
                },
                handleSize(size) {
                    if (size <= 1024) {
                        return size + 'B'
                    } else if (size <= 1024 * 1024) {
                        return (size / 1024).toFixed(2) + 'KB'
                    } else if (size <= 1024 * 1024 * 1024) {
                        return (size / 1024 / 1024).toFixed(2) + 'MB'
                    } else {
                        return (size / 1024 / 1024 / 1024).toFixed(2) + 'GB'
                    }
                },
                isImageFile(fileType) {
                    return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(fileType.toLowerCase())
                },
                isVideoFile(fileType) {
                    return ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'flv'].includes(fileType.toLowerCase())
                },
                async previewImage(file) {
                    // 构建图片路径 - 使用基础路径和文件路径
                    const settings = await fetchSettings()
                    const basePath = settings.downloadPath || ''
                    const filePath = file.filePath
                    
                    // 设置预览图片的URL和名称
                    this.previewImageSrc = `${BASE_URL}/api/file/preview?path=${encodeURIComponent(filePath)}`
                    this.previewImageName = file.fileName
                    this.showImagePreview = true
                },
                async playVideo(file) {
                    // 构建视频路径
                    const filePath = file.filePath
                    
                    // 设置视频URL和名称
                    this.videoSrc = `${BASE_URL}/api/file/stream?path=${encodeURIComponent(filePath)}`
                    this.videoName = file.fileName
                    this.showVideoPlayer = true
                },
                closePreview() {
                    this.showImagePreview = false
                    this.previewImageSrc = ''
                    this.previewImageName = ''
                },
                closeVideoPlayer() {
                    this.showVideoPlayer = false
                    this.videoSrc = ''
                    this.videoName = ''
                },
                openRenameModal(file) {
                    this.selectedFile = file
                    this.newFileName = file.fileName
                    this.showRenameModal = true
                },
                closeRenameModal() {
                    this.showRenameModal = false
                    this.selectedFile = null
                    this.newFileName = ''
                },
                renameSelectedFile() {
                    if (this.selectedFile) {
                        this.renameFile(this.selectedFile, this.newFileName)
                    }
                },
                async renameFile(file, newName) {
                    if (file && newName) {
                        let data = {
                            path: file.filePath,
                            newName: newName
                        }
                        await renameFile(file.filePath, newName)
                        this.fetchList(this.filePath, this.optionValue, this.sort)
                        this.closeRenameModal()
                    }
                },
                confirmDelete(file) {
                    this.selectedFile = file
                    this.showDeleteConfirm = true
                },
                closeDeleteConfirm() {
                    this.showDeleteConfirm = false
                    this.selectedFile = null
                },
                deleteSelectedFile() {
                    if (this.selectedFile) {
                        this.deleteFile(this.selectedFile)
                    }
                },
                async deleteFile(file) {
                    if (file) {
                        await deleteFile(file.filePath)
                        this.fetchList(this.filePath, this.optionValue, this.sort)
                        this.closeDeleteConfirm()
                    }
                },
                openCreateDirModal() {
                    this.showCreateDirModal = true
                    this.newDirName = ''
                },
                closeCreateDirModal() {
                    this.showCreateDirModal = false
                    this.newDirName = ''
                },
                async createDir() {
                    if (this.newDirName) {
                        let path = this.filePath.join('/')
                        // 确保路径以斜杠开头
                        if (path && !path.startsWith('/')) {
                            path = '/' + path
                        }
                        // 如果是根目录，确保用空字符串或斜杠
                        if (path === '' || path === '/') {
                            path = '/'
                        }
                        console.log('Creating directory:', path, this.newDirName)
                        try {
                            await createDirectory(path, this.newDirName)
                            this.fetchList(this.filePath, this.optionValue, this.sort)
                            this.closeCreateDirModal()
                        } catch (error) {
                            console.error('Failed to create directory:', error)
                            alert('Failed to create directory: ' + (error.message || 'Unknown error'))
                        }
                    }
                },
                toggleAdvancedSearch() {
                    this.showAdvancedSearch = !this.showAdvancedSearch
                },
                async performSearch() {
                    if (!this.searchQuery.trim()) {
                        return
                    }
                    
                    this.isSearching = true
                    let path = this.filePath.join('/')
                    try {
                        const results = await searchFiles(
                            path, 
                            this.searchQuery, 
                            this.exactMatch, 
                            this.recursiveSearch
                        )
                        this.searchResults = results
                        this.files = results
                        console.log('Search results:', results)
                    } catch (error) {
                        console.error('Search error:', error)
                    } finally {
                        this.isSearching = false
                    }
                },
                clearSearch() {
                    this.searchQuery = ''
                    this.isSearching = false
                    this.searchResults = []
                    this.fetchList(this.filePath, this.optionValue, this.sort)
                }
            }
        }
    </script>

</head>

                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M15.75 17.25L12 21m0 0l-3.75-3.75M12 21V3" />
                                                </svg>
                                                <svg x-show="sort !== 'gmtModified'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"

                                                </svg>
                                            </div>

                                            Action

                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 max-h-[calc(100vh-15rem)] overflow-y-auto">
                                    <template x-for="file in files" :key="file">
                                        <tr>
                                            <td
                                                class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-800 sm:pl-0">
                                                <div class="flex items-center space-x-2 w-auto"
                                                    :class="file.directory ? 'cursor-pointer hover:text-indigo-600' : ((isImageFile(file.fileType) || isVideoFile(file.fileType)) ? 'cursor-pointer hover:text-indigo-600' : 'cursor-default')"
                                                    @click="goFile(file)">
                                                    <template x-if="file.directory">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                                            class="w-6 h-6 text-yllow-400 hover:text-yellow-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                                d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && isVideoFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-red-400 hover:text-red-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && isImageFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-blue-400 hover:text-blue-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && !isImageFile(file.fileType) && !isVideoFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-gray-400">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                                        </svg>
                                                    </template>
                                                    <p x-text="file.fileName"></p>
                                                </div>
                                            </td>
                                            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                                <template x-if="!file.directory">
                                                    <p x-text="file.fileSize"></p>
                                                </template>
                                            </td>
                                            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                                <template x-if="file.gmtModified">
                                                    <p x-text="new Date(file.gmtModified).toLocaleDateString()"></p>
                                                </template>
                                            </td>
                                            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                                <div class="flex space-x-2">
                                                    <button @click.stop="openRenameModal(file)" class="text-indigo-600 hover:text-indigo-900">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                                                        </svg>
                                                    </button>
                                                    <button @click.stop="confirmDelete(file)" class="text-red-600 hover:text-red-900">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <!-- 图片预览模态框 -->
    <div x-show="showImagePreview" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-75" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="relative bg-white rounded-lg max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <!-- 模态框头部 -->
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900" x-text="previewImageName"></h3>
                <button @click="closePreview" class="text-gray-400 hover:text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- 图片容器 -->
            <div class="p-6 flex-grow overflow-auto flex items-center justify-center">
                <img :src="previewImageSrc" alt="预览图片" class="max-w-full max-h-[70vh] object-contain" />
            </div>
            <!-- 模态框底部 -->
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end">
                <button @click="closePreview" class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">
                    Close
                </button>
            </div>
        </div>
    </div>
    
    <!-- 视频播放模态框 -->
    <div x-show="showVideoPlayer" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="relative bg-gray-900 rounded-lg max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <!-- 模态框头部 -->
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white" x-text="videoName"></h3>
                <button @click="closeVideoPlayer" class="text-gray-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- 视频播放器容器 -->
            <div class="p-6 flex-grow overflow-auto flex items-center justify-center bg-black">
                <video :src="videoSrc" class="max-w-full max-h-[70vh]" controls autoplay controlsList="nodownload">
                    您的浏览器不支持HTML5视频播放器
                </video>
            </div>
            <!-- 模态框底部 -->
            <div class="px-6 py-4 border-t border-gray-700 flex justify-end">
                <button @click="closeVideoPlayer" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- 添加重命名模态框 -->
    <div x-show="showRenameModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Rename File</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Current Filename</label>
                <p class="text-gray-600" x-text="selectedFile?.fileName || ''"></p>
            </div>
            <div class="mb-6">
                <label for="newFileName" class="block text-sm font-medium text-gray-700 mb-2">New Filename</label>
                <input type="text" id="newFileName" x-model="newFileName" 
                       class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border"
                       placeholder="Enter new filename">
            </div>
            <div class="flex justify-end space-x-3">
                <button @click="closeRenameModal" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">
                    Cancel
                </button>
                <button @click="renameSelectedFile" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                    Confirm Rename
                </button>
            </div>
        </div>
    </div>

    <!-- 添加删除确认模态框 -->
    <div x-show="showDeleteConfirm" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Confirm Delete</h3>
            <p class="text-gray-600 mb-6">
                Are you sure you want to delete <span class="font-bold" x-text="selectedFile?.fileName || ''"></span>? This action cannot be undone.
            </p>
            <div class="flex justify-end space-x-3">
                <button @click="closeDeleteConfirm" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">
                    Cancel
                </button>
                <button @click="deleteSelectedFile" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                    Confirm Delete
                </button>
            </div>
        </div>
    </div>

    <!-- 创建文件夹模态框 -->
    <div x-show="showCreateDirModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden">
            <!-- 模态框头部 -->
            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-900">Create New Folder</h3>
            </div>
            
            <!-- 模态框内容 -->
            <div class="px-4 py-5">
                <div class="mb-4">
                    <label for="new-dir-name" class="block text-sm font-medium text-gray-700 mb-2">Folder Name</label>
                    <input 
                        type="text" 
                        id="new-dir-name"
                        x-model="newDirName"
                        @keyup.enter="createDir"
                        class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                        placeholder="Enter folder name">
                </div>
            </div>
            
            <!-- 模态框底部按钮 -->
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                <button @click="createDir" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                    Create
                </button>
                <button @click="closeCreateDirModal" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</body>

</html>
