<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File</title>
    <script src="./assets/tailwind-3.3.2.js"></script>
    <script type="module" src="./assets/alpine.min.js"></script>
    <script nomodule src="./assets/alpine-ie11.min.js" defer></script>
    <script src="./api.js"></script>
    <script>
        function initFile() {
            var originPath = '/'
            return {
                files: [],
                optionValue: '',
                filePath: [''],
                sort: '',
                order: 'up',
                currentPageColor: '',
                showImagePreview: false,
                previewImageSrc: '',
                previewImageName: '',
                showVideoPlayer: false,
                videoSrc: '',
                videoName: '',
                async initData() {
                    this.currentPageColor = document.body.getAttribute('data-page-type')
                    this.fetchList()
                },
                async fetchList(paths, type, sort) {
                    if (sort) {
                        if (sort === this.sort) {
                            this.order = (this.order === 'up' ? 'down' : 'up')
                        } else {
                            this.sort = sort
                            this.order = 'up'
                        }
                    }
                    
                    console.log('当前排序:', '字段=', this.sort, '方向=', this.order)
                    let path = '';
                    if (paths) {
                        for (let i = 0; i < paths.length; i++) {
                            path = paths.join('/')
                        }
                    }
                    if (type) {
                        this.optionValue = type
                    }
                    
                    let data = {
                        path: path || '/',
                        type: this.optionValue,
                        sort: this.sort,
                        order: this.order
                    }
                    this.files = await fetchFileList(data, path)
                },
                async goFile(file) {
                    if (file && file.directory) {
                        let path = file.filePath
                        let data = {
                            path: path,
                            type: this.optionValue,
                            sort: this.sort,
                            order: this.order
                        }
                        this.filePath.push(file.fileName)
                        this.files = await fetchFileList(data)
                        console.log('导航到目录:', path, '文件列表:', this.files)
                    } else if (file && this.isImageFile(file.fileType)) {
                        // 预览图片
                        this.previewImage(file)
                    } else if (file && this.isVideoFile(file.fileType)) {
                        // 播放视频
                        this.playVideo(file)
                    }
                },
                async goBack(path) {
                    const index = this.filePath.indexOf(path)
                    this.filePath.splice(index + 1)
                    if (this.filePath) {
                        for (let i = 0; i < this.filePath.length; i++) {
                            path = this.filePath.join('/')
                        }
                    }
                    let data = {
                        path: path,
                        type: this.optionValue,
                        sort: this.sort,
                        order: this.order
                    }
                    this.files = await fetchFileList(data)
                },
                handleSize(size) {
                    if (size <= 1024) {
                        return size + 'B'
                    } else if (size <= 1024 * 1024) {
                        return (size / 1024).toFixed(2) + 'KB'
                    } else if (size <= 1024 * 1024 * 1024) {
                        return (size / 1024 / 1024).toFixed(2) + 'MB'
                    } else {
                        return (size / 1024 / 1024 / 1024).toFixed(2) + 'GB'
                    }
                },
                isImageFile(fileType) {
                    return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(fileType.toLowerCase())
                },
                isVideoFile(fileType) {
                    return ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'flv'].includes(fileType.toLowerCase())
                },
                async previewImage(file) {
                    // 构建图片路径 - 使用基础路径和文件路径
                    const settings = await fetchSettings()
                    const basePath = settings.downloadPath || ''
                    const filePath = file.filePath
                    
                    // 设置预览图片的URL和名称
                    this.previewImageSrc = `${BASE_URL}/api/file/preview?path=${encodeURIComponent(filePath)}`
                    this.previewImageName = file.fileName
                    this.showImagePreview = true
                },
                async playVideo(file) {
                    // 构建视频路径
                    const filePath = file.filePath
                    
                    // 设置视频URL和名称
                    this.videoSrc = `${BASE_URL}/api/file/stream?path=${encodeURIComponent(filePath)}`
                    this.videoName = file.fileName
                    this.showVideoPlayer = true
                },
                closePreview() {
                    this.showImagePreview = false
                    this.previewImageSrc = ''
                    this.previewImageName = ''
                },
                closeVideoPlayer() {
                    this.showVideoPlayer = false
                    this.videoSrc = ''
                    this.videoName = ''
                }
            }
        }
    </script>

</head>

<body x-data="initFile()" x-init="initData" data-page-type="file" class="bg-gray-50">
    <div class="w-full bg-gray-900 py-4  text-white">
        <p class="max-w-7xl flex mx-auto font-semibold text-left px-6 xl:px-0"> Download Server</p>
    </div>
    <div class="flex max-w-7xl mx-auto py-10 pl-4 pr-10  bg-white relative">
        <div class="lg:border-r space-y-4 h-[calc(100vh-10rem)]">
            <a href="./index.html"
                class="flex items-center space-x-2  cursor-pointer p-2  lg:px-4 rounded-l hover:bg-opacity-90 border-l-4"
                :class="currentPageColor==='file' && 'bg-yellow-400 border-yellow-500'">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                </svg>
                <span class="w-20"> File</span>
            </a>
            <a href="./tasks.html"
                class="flex items-center space-x-2 hover:text-indigo-700 cursor-pointer p-2  lg:px-4 rounded-l border-l-4 border-transparent">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9.75v6.75m0 0l-3-3m3 3l3-3m-8.25 6a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>
                <span> Transfers</span>
            </a>

            <a href="./setting.html"
                class="flex items-center space-x-2 hover:text-indigo-700 cursor-pointer p-2  lg:px-4 rounded-l border-l-4 border-transparent">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span> Settings</span>
            </a>
        </div>
        <div class="space-y-10 w-full flex-grow pl-10">
            <div class="flex items-center justify-between w-full px-4 sm:px-6 lg:px-8">
                <div class="flex items-center space-x-1">
                    <template x-if="filePath.length>0">
                        <template x-for="item in filePath">
                            <div class="flex items-center space-x-1">
                                <p class="text-xl -mt-4 cursor-pointer hover:text-indigo-600" x-text="item"
                                    @click="goBack(item)"></p>
                                <p class="text-xl -mt-4 cursor-pointer hover:text-indigo-600">/</p>
                            </div>
                        </template>
                    </template>
                </div>
                <select x-model="optionValue" @change="fetchList(filePath,optionValue)" class="rounded-md">
                    <option value="">All(*.*)</option>
                    <option value="Video">Video(*.mp4;*.mov)</option>
                    <option value="Photo">Photo(*.png;*.jpg;*.gif)</option>
                    <option value="Archive">Archive(*.zip;*.rar;*.tar)</option>
                    <option value="Document">Document(*.pptx;*.docx;*.xlsx)</option>
                </select>
            </div>
            <div class="px-4 sm:px-6 lg:px-8">
                <div class="mt-8 flow-root">
                    <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                        <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
                            <table class="min-w-full divide-y divide-gray-300">
                                <thead>
                                    <tr>
                                        <th scope="col"
                                            class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0">
                                            <div class="flex items-center cursor-pointer"
                                                @click="fetchList(filePath, undefined, 'name')">
                                                <p>File name</p>
                                                <svg x-show="sort === 'name' && order === 'up'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 6.75L12 3m0 0l3.75 3.75M12 3v18" />
                                                </svg>
                                                <svg x-show="sort === 'name' && order === 'down'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M15.75 17.25L12 21m0 0l-3.75-3.75M12 21V3" />
                                                </svg>
                                                <svg x-show="sort !== 'name'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
                                                </svg>
                                            </div>
                                        </th>
                                        <th scope="col"
                                            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                                            <div class="flex items-center cursor-pointer"
                                                @click="fetchList(filePath, undefined, 'size')">
                                                <p>Size</p>
                                                <svg x-show="sort === 'size' && order === 'up'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 6.75L12 3m0 0l3.75 3.75M12 3v18" />
                                                </svg>
                                                <svg x-show="sort === 'size' && order === 'down'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M15.75 17.25L12 21m0 0l-3.75-3.75M12 21V3" />
                                                </svg>
                                                <svg x-show="sort !== 'size'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
                                                </svg>
                                            </div>
                                        </th>
                                        <th scope="col"
                                            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                                            <div class="flex items-center cursor-pointer"
                                                @click="fetchList(filePath, undefined, 'gmtModified')">
                                                <p>Modified time</p>
                                                <svg x-show="sort === 'gmtModified' && order === 'up'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 6.75L12 3m0 0l3.75 3.75M12 3v18" />
                                                </svg>
                                                <svg x-show="sort === 'gmtModified' && order === 'down'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M15.75 17.25L12 21m0 0l-3.75-3.75M12 21V3" />
                                                </svg>
                                                <svg x-show="sort !== 'gmtModified'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
                                                </svg>
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 max-h-[calc(100vh-15rem)] overflow-y-auto">
                                    <template x-for="file in files" :key="file">
                                        <tr>
                                            <td
                                                class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-800 sm:pl-0">
                                                <div class="flex items-center space-x-2 w-auto"
                                                    :class="file.directory ? 'cursor-pointer hover:text-indigo-600' : ((isImageFile(file.fileType) || isVideoFile(file.fileType)) ? 'cursor-pointer hover:text-indigo-600' : 'cursor-default')"
                                                    @click="goFile(file)">
                                                    <template x-if="file.directory">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                                            class="w-6 h-6 text-yllow-400 hover:text-yellow-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                                d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && isVideoFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-red-400 hover:text-red-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && isImageFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-blue-400 hover:text-blue-500">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                                        </svg>
                                                    </template>
                                                    <template x-if="!file.directory && !isImageFile(file.fileType) && !isVideoFile(file.fileType)">
                                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
                                                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
                                                            class="w-6 h-6 text-gray-400">
                                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                                        </svg>
                                                    </template>
                                                    <p x-text="file.fileName"></p>
                                                </div>
                                            </td>
                                            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                                <template x-if="!file.directory">
                                                    <p x-text="file.fileSize"></p>
                                                </template>
                                            </td>
                                            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                                <template x-if="file.gmtModified">
                                                    <p x-text="new Date(file.gmtModified).toLocaleDateString()"></p>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <!-- 图片预览模态框 -->
    <div x-show="showImagePreview" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-75" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="relative bg-white rounded-lg max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <!-- 模态框头部 -->
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900" x-text="previewImageName"></h3>
                <button @click="closePreview" class="text-gray-400 hover:text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- 图片容器 -->
            <div class="p-6 flex-grow overflow-auto flex items-center justify-center">
                <img :src="previewImageSrc" alt="预览图片" class="max-w-full max-h-[70vh] object-contain" />
            </div>
            <!-- 模态框底部 -->
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end">
                <button @click="closePreview" class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">
                    关闭
                </button>
            </div>
        </div>
    </div>
    
    <!-- 视频播放模态框 -->
    <div x-show="showVideoPlayer" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="relative bg-gray-900 rounded-lg max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <!-- 模态框头部 -->
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white" x-text="videoName"></h3>
                <button @click="closeVideoPlayer" class="text-gray-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- 视频播放器容器 -->
            <div class="p-6 flex-grow overflow-auto flex items-center justify-center bg-black">
                <video :src="videoSrc" class="max-w-full max-h-[70vh]" controls autoplay controlsList="nodownload">
                    您的浏览器不支持HTML5视频播放器
                </video>
            </div>
            <!-- 模态框底部 -->
            <div class="px-6 py-4 border-t border-gray-700 flex justify-end">
                <button @click="closeVideoPlayer" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                    关闭
                </button>
            </div>
        </div>
    </div>
</body>

</html>
